<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="description" content="PsiakApka — nowoczesny organizer opieki nad psem.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>PsiakApka</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      mint: '#A3C9A8', ink: '#121212', panel: '#1b1b1b', panel2: '#232323'
    }, borderRadius: { '2xl':'1.25rem' }}}}
  </script>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;background:#121212;color:#f5f5f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh}.app{min-height:100vh;padding-bottom:92px}.glass{background:rgba(35,35,35,.72);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 40px rgba(0,0,0,.22)}
    .card{background:#1b1b1b;border:1px solid rgba(255,255,255,.07)}.muted{color:#a9aaa9}.mint{color:#A3C9A8}.btn{border-radius:16px;padding:12px 16px;font-weight:700;transition:.18s}.btn-primary{background:#A3C9A8;color:#121212}.btn-primary:active{transform:scale(.98)}
    input,select,textarea{width:100%;background:#181818;border:1px solid #3a3a3a;color:#f5f5f5;border-radius:14px;padding:12px 13px;outline:none}input:focus,select:focus,textarea:focus{border-color:#A3C9A8;box-shadow:0 0 0 3px rgba(163,201,168,.12)}
    label{display:block;font-size:.82rem;color:#c9cac9;margin:0 0 7px}.chip{border:1px solid #3b3b3b;background:#202020;border-radius:999px;padding:8px 11px;font-size:.8rem}.chip.active{background:#A3C9A8;color:#121212;border-color:#A3C9A8}
    .nav{position:fixed;z-index:30;bottom:0;left:0;right:0;background:rgba(18,18,18,.88);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.08);padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));}
    .nav-inner{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav button{color:#8f918f;font-size:10px;padding:7px 2px;border-radius:13px}.nav button.active{color:#A3C9A8;background:#202a22}.fab{position:fixed;z-index:35;right:20px;bottom:82px;width:56px;height:56px;border-radius:50%;background:#A3C9A8;color:#121212;font-size:28px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
    .screen{max-width:760px;margin:auto;padding:18px 16px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.iconbtn{width:40px;height:40px;border-radius:13px;background:#1d1d1d;border:1px solid #333;display:grid;place-items:center}
    .bar{height:8px;border-radius:999px;background:#303030;overflow:hidden}.bar>i{display:block;height:100%;background:#A3C9A8;border-radius:999px}.modal{position:fixed;z-index:60;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#1b1b1b;border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow:auto;border:1px solid #363636}.hidden{display:none!important}.toast{position:fixed;z-index:100;left:50%;bottom:155px;transform:translateX(-50%);background:#2a2a2a;border:1px solid #444;padding:10px 14px;border-radius:999px;box-shadow:0 10px 30px #0008}
    .dog-avatar{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:#294238}.check{width:24px;height:24px;border-radius:50%;border:2px solid #555;display:grid;place-items:center}.check.done{background:#A3C9A8;border-color:#A3C9A8;color:#121212}.timeline:before{content:"";position:absolute;left:28px;top:16px;bottom:16px;width:2px;background:#333}.timeline-item{position:relative;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}.chart{height:180px;display:flex;align-items:flex-end;gap:10px;padding:18px 4px 0}.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:7px}.stack{width:100%;max-width:30px;border-radius:8px 8px 3px 3px;background:linear-gradient(to top,#78a67f,#A3C9A8);min-height:12px}.col span{font-size:10px;color:#999}.wizard-dot{width:7px;height:7px;border-radius:50%;background:#444}.wizard-dot.active{width:22px;background:#A3C9A8}.qr{background:white;padding:10px;border-radius:12px;display:grid;place-items:center}
  </style>
</head>
<body>
<div id="app" class="app"></div>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
const KEY='psiakapka-v1';
const breeds=['Labrador Retriever','Golden Retriever','Border Collie','Owczarek niemiecki','Mieszaniec','Beagle','Cocker spaniel','Buldog francuski','Jack Russell terrier','Yorkshire terrier'];
const defaultState={onboarded:false,dog:{name:'',breed:'',gender:'Pies',chip:'',dob:'',adoption:'',weight:'',idealMin:'',idealMax:'',fixed:false,allergies:[],temperament:'',meals:3,foodType:'Sucha',walks:'2 razy dziennie (30 min)',vet:'',clinic:'',phone:''},hydration:[],tasks:[{id:1,n:'Śniadanie',time:'08:00',type:'Karma',done:true},{id:2,n:'Spacer',time:'12:00',type:'30 min',done:false},{id:3,n:'Pielęgnacja',time:'16:00',type:'Szczotkowanie',done:false},{id:4,n:'Leki',time:'20:00',type:'Witamina D',done:true}],inventory:{food:[],meds:[],other:[]},expenses:[],health:[],view:'dom'};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(defaultState);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function icon(type){const m={home:'⌂',care:'♡',box:'▣',health:'✚',profile:'●',plus:'+',water:'◉',walk:'⌁',food:'◒',med:'✚',star:'★',phone:'☎',back:'‹',settings:'⚙'};return m[type]||'•'}
function age(dob){if(!dob)return '—';let d=new Date(dob),n=new Date();let y=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth(),day=n.getDate()-d.getDate();if(day<0){m--;day+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(m<0){y--;m+=12}return `${y} l. ${m} mies.`}
function fmtDate(x){return x?new Date(x).toLocaleDateString('pl-PL'):''}
function setView(v){state.view=v;save();render()}
function layout(content,title=''){return `<main class="screen">${title?`<div class="topbar"><div><div class="text-xs muted">PsiakApka</div><h1 class="text-2xl font-extrabold">${title}</h1></div><button class="iconbtn" onclick="setView('profil')">${icon('settings')}</button></div>`:''}${content}</main>`}
function nav(){return `<nav class="nav"><div class="nav-inner">${[['dom','home','Dom'],['opieka','care','Opieka'],['zapasy','box','Zapasy'],['zdrowie','health','Zdrowie'],['profil','profile','Profil / SOS']].map(x=>`<button class="${state.view===x[0]?'active':''}" onclick="setView('${x[0]}')"><div class="text-lg">${icon(x[1])}</div>${x[2]}</button>`).join('')}</div></nav>`}
function render(){document.getElementById('app').innerHTML=state.onboarded?screen()+nav():onboarding();if(!state.onboarded)bindBreed()}
function screen(){let c={dom:dashboard,opieka:care,zapasy:inventory,zdrowie:health,profil:profile}[state.view]||dashboard;return c()}
function dashboard(){let d=state.dog;return layout(`
  <section class="card rounded-2xl p-4 mb-4"><div class="flex items-center gap-3"><div class="dog-avatar text-3xl">🐕</div><div class="flex-1"><div class="text-2xl font-extrabold">${esc(d.name)}</div><div class="muted text-sm">${esc(d.breed)} · ${age(d.dob)}</div><div class="flex gap-2 mt-2"><span class="chip active">${d.weight||'—'} kg</span><span class="chip">● Aktywny</span></div></div></div></section>
  <div class="grid grid-cols-2 gap-3 mb-4"><div class="card rounded-2xl p-4"><div class="muted text-xs">Dzisiaj</div><div class="text-2xl font-bold mt-1">${state.tasks.filter(t=>t.done).length}/${state.tasks.length}</div><div class="text-xs muted">zadań wykonanych</div></div><div class="card rounded-2xl p-4"><div class="muted text-xs">Budżet pupila</div><div class="text-2xl font-bold mt-1">${expenseMonth()} zł</div><div class="text-xs muted">w tym miesiącu</div></div></div>
  <section class="card rounded-2xl p-4 mb-4"><div class="flex justify-between items-center mb-3"><h2 class="font-bold text-lg">Harmonogram dnia</h2><button class="text-sm mint" onclick="setView('opieka')">Zobacz więcej →</button></div><div class="space-y-3">${state.tasks.slice(0,4).map(taskRow).join('')}</div></section>
  <div class="grid grid-cols-2 gap-3"><button class="card rounded-2xl p-4 text-left" onclick="openHydration()"><div class="mint text-xl">${icon('water')}</div><div class="font-bold mt-2">Nawodnienie</div><div class="muted text-xs mt-1">Dodaj wypitą wodę</div></button><button class="card rounded-2xl p-4 text-left" onclick="openExpense()"><div class="mint text-xl">₿</div><div class="font-bold mt-2">Budżet pupila</div><div class="muted text-xs mt-1">Dodaj wydatek</div></button></div>
  <section class="glass rounded-2xl p-4 mt-4"><div class="flex items-center gap-3"><div class="text-2xl">🆘</div><div class="flex-1"><div class="font-bold">Karta SOS & Tryb Pet-Sitter</div><div class="muted text-xs">Szybki dostęp do opiekuna i weterynarza.</div></div><button class="btn btn-primary text-sm" onclick="setView('profil')">Otwórz</button></div></section>
  `,'Dom')}
function taskRow(t){return `<div class="timeline-item"><button class="check ${t.done?'done':''}" onclick="toggleTask(${t.id})">${t.done?'✓':''}</button><div><div class="font-semibold ${t.done?'line-through opacity-60':''}">${esc(t.n)}</div><div class="text-xs muted">${esc(t.time)} · ${esc(t.type)}</div></div><span class="text-xs muted">${t.done?'Gotowe':'Do zrobienia'}</span></div>`}
function toggleTask(id){let t=state.tasks.find(x=>x.id===id);t.done=!t.done;save();render();toast(t.done?'Zadanie wykonane':'Zadanie oznaczone jako niewykonane')}
function care(){return layout(`<section class="card rounded-2xl p-4 mb-4"><div class="flex justify-between"><div><div class="text-sm muted">Dzisiaj</div><div class="text-2xl font-extrabold">${state.tasks.filter(t=>t.done).length}/${state.tasks.length} wykonanych</div></div><div class="text-3xl mint">✓</div></div><div class="bar mt-4"><i style="width:${state.tasks.length?state.tasks.filter(t=>t.done).length/state.tasks.length*100:0}%"></i></div></section><section class="card rounded-2xl p-4"><h2 class="font-bold text-lg mb-4">Harmonogram dnia</h2><div class="space-y-5">${state.tasks.map(taskRow).join('')}</div><button class="btn btn-primary w-full mt-5" onclick="openTask()">+ Dodaj czynność</button></section>`,'Opieka')}
function inventory(){return layout(`<section class="glass rounded-2xl p-4 mb-4"><div class="text-2xl mb-1">🌿</div><h2 class="font-bold text-lg">Zrób z zapasów swojego pomocnika</h2><p class="muted text-sm mt-1">Ustaw przypomnienia o zamówieniach i zachowaj linki do sklepów.</p></section>${invGroup('KARMA','food','Karma')} ${invGroup('LEKI','meds','Leków')} ${invGroup('INNE ZAPASY','other','Innych zapasów')}<button class="fab" onclick="openAddSupply()">+</button>`,'Zapasy')}
function invGroup(label,key,word){let a=state.inventory[key];return `<section class="card rounded-2xl p-4 mb-3"><div class="flex justify-between items-center"><h2 class="font-bold text-sm tracking-wider">${label}</h2><button class="text-sm mint" onclick="openAddSupply('${key}')">Dodaj →</button></div>${a.length?a.map((x,i)=>`<div class="mt-3 p-3 rounded-xl bg-[#232323] flex justify-between"><div><div class="font-semibold">${esc(x.name)}</div><div class="muted text-xs">${esc(x.qty||'')} ${esc(x.unit||'')} ${x.price?'· '+esc(x.price)+' zł':''}</div></div><button class="muted" onclick="removeInv('${key}',${i})">×</button></div>`).join(''):`<div class="py-7 text-center muted text-sm">Brak zapasów</div>`}</section>`}
function removeInv(k,i){state.inventory[k].splice(i,1);save();render();toast('Zapas usunięty')}
function health(){return layout(`<div class="grid grid-cols-2 gap-3 mb-4"><div class="card rounded-2xl p-4"><div class="mint text-xl">♡</div><div class="font-bold mt-2">Nawodnienie</div><div class="text-xs muted mt-1">${state.hydration.length} wpisów</div></div><div class="card rounded-2xl p-4"><div class="mint text-xl">✚</div><div class="font-bold mt-2">Dokumentacja</div><div class="text-xs muted mt-1">${state.health.length} wpisów</div></div></div><section class="card rounded-2xl p-4 mb-4"><div class="flex justify-between items-center"><h2 class="font-bold text-lg">Nawodnienie</h2><button class="btn btn-primary text-sm" onclick="openHydration()">+ Dodaj</button></div><div class="muted text-xs mt-1">Ostatnie 7 dni</div>${hydrationChart()}</section><section class="card rounded-2xl p-4"><div class="flex justify-between"><h2 class="font-bold text-lg">Historia zdrowia</h2><button class="mint text-sm" onclick="openHealth()">Dodaj wpis</button></div>${state.health.length?state.health.map(x=>`<div class="mt-3 p-3 rounded-xl bg-[#232323]"><div class="font-semibold">${esc(x.title)}</div><div class="muted text-xs">${esc(x.date)} · ${esc(x.note)}</div></div>`).join(''):`<div class="py-7 text-center muted text-sm">Brak wpisów</div>`}</section>`,'Zdrowie')}
function hydrationChart(){let days=['wt.','śr.','czw.','pt.','sob.','niedz.','pon.'];let vals=[35,55,45,65,50,80,60];return `<div class="chart">${days.map((d,i)=>`<div class="col"><div class="stack" style="height:${vals[i]}%"></div><span>${d}</span></div>`).join('')}</div><div class="flex gap-3 text-xs muted mt-2"><span>● Mało</span><span class="mint">● Normalnie</span><span>● Dużo</span></div><div class="glass rounded-xl p-3 mt-4 text-sm">💧 Śledź nawodnienie, aby wspierać zdrowie nerek</div>`}
function profile(){let d=state.dog;return layout(`<section class="card rounded-2xl p-4 mb-3"><div class="flex items-center gap-3"><div class="dog-avatar text-3xl">🐕</div><div><div class="font-extrabold text-xl">${esc(d.name)}</div><div class="muted text-sm">${esc(d.breed)} · ${age(d.dob)}</div></div></div></section><section class="card rounded-2xl p-4 mb-3"><h2 class="font-bold text-lg">Karta SOS & Tryb Pet-Sitter</h2><div class="grid grid-cols-[100px_1fr] gap-4 items-center mt-4"><div class="qr"><div class="text-black text-3xl font-black">▦</div><div class="text-black text-[8px] mt-1">PSIAKAPKA</div></div><div class="text-sm"><div class="font-semibold">Skanuj kartę, aby szybko uzyskać dostęp do informacji o ${esc(d.name)}.</div><div class="muted mt-2">Weterynarz: ${esc(d.vet)||'—'}<br>Telefon: ${esc(d.phone)||'—'}</div></div></div><div class="grid grid-cols-2 gap-2 mt-4"><button class="btn btn-primary" onclick="callVet()">☎ Zadzwoń</button><button class="btn card" onclick="printSOS()">🖨 Drukuj kartę</button></div></section><section class="card rounded-2xl p-4 mb-3"><h2 class="font-bold text-lg">Dane psa</h2><div class="grid grid-cols-2 gap-3 mt-3 text-sm"><div><span class="muted">Waga</span><br>${esc(d.weight)||'—'} kg</div><div><span class="muted">Płeć</span><br>${esc(d.gender)}</div><div><span class="muted">Mikrochip</span><br>${esc(d.chip)||'—'}</div><div><span class="muted">Dieta</span><br>${esc(d.foodType)}</div></div><button class="btn card w-full mt-4" onclick="startEditDog()">Edytuj profil</button></section><section class="card rounded-2xl p-4"><h2 class="font-bold text-lg">Eksport / Import danych</h2><p class="muted text-sm mt-1">Kopia zapasowa całej aplikacji w pliku JSON.</p><div class="grid grid-cols-2 gap-2 mt-4"><button class="btn btn-primary" onclick="exportData()">Eksportuj</button><label class="btn card text-center cursor-pointer">Importuj<input type="file" accept=".json,application/json" class="hidden" onchange="importData(event)"></label></div></section>`,'Profil / SOS')}
function expenseMonth(){return state.expenses.reduce((s,x)=>s+Number(x.amount||0),0).toFixed(2)}
function onboarding(){return `<div class="min-h-screen flex items-center justify-center p-5"><div class="w-full max-w-xl"><div class="text-center mb-7"><div class="mx-auto w-24 h-24 rounded-[28px] bg-[#294238] grid place-items-center text-5xl">🐕‍🦺</div><h1 class="text-4xl font-black mt-4">Psiak<span class="mint">Apka</span></h1><p class="muted mt-2">Zdrowy pies, szczęśliwy właściciel.</p></div><div class="card rounded-2xl p-5"><div class="flex justify-between text-xs muted mb-5"><span>Krok <b id="stepNo">1</b> z 7</span><span id="stepTitle">Podstawowe informacje</span></div><div id="wiz"></div></div></div></div>`}
let wizStep=1;
function wiz(){let d=state.dog;let body=[
`<h2 class="text-2xl font-extrabold">Podstawowe informacje</h2><p class="muted text-sm mt-1 mb-5">Zacznijmy od profilu Twojego psa.</p><label>Imię psa<input id="w_name" value="${esc(d.name)}" placeholder="np. Burek"></label><label class="mt-3">Rasa<input id="w_breed" value="${esc(d.breed)}" placeholder="Wpisz rasę" autocomplete="off"><div id="breedList" class="mt-1"></div></label><div class="mt-3"><label>Płeć</label><div class="grid grid-cols-2 gap-2">${['Pies','Suka'].map(x=>`<button class="chip ${d.gender===x?'active':''}" onclick="dGender('${x}')">${x}</button>`).join('')}</div></div><label class="mt-3">Numer mikroczipa (opcjonalnie)<input id="w_chip" value="${esc(d.chip)}"></label>`,
`<h2 class="text-2xl font-extrabold">Wiek i data</h2><p class="muted text-sm mt-1 mb-5">Podaj wiek lub datę urodzenia psa.</p><div class="grid grid-cols-2 gap-2"><button class="chip active">Wiek</button><button class="chip">Data urodzenia</button></div><label class="mt-4">Data urodzenia<input id="w_dob" type="date" value="${esc(d.dob)}"></label><label class="mt-3">Data adopcji (opcjonalnie)<input id="w_adoption" type="date" value="${esc(d.adoption)}"></label>`,
`<h2 class="text-2xl font-extrabold">Waga i zdrowie</h2><p class="muted text-sm mt-1 mb-5">Ustaw aktualne parametry.</p><label>Obecna waga (kg)<input id="w_weight" type="number" step=".1" value="${esc(d.weight)}"></label><div class="grid grid-cols-2 gap-2 mt-3"><label>Docelowo od (kg)<input id="w_min" type="number" step=".1" value="${esc(d.idealMin)}"></label><label>Docelowo do (kg)<input id="w_max" type="number" step=".1" value="${esc(d.idealMax)}"></label></div><div class="mt-4"><label>Wykastrowany / wysterylizowana</label><button class="chip ${d.fixed?'active':''}" onclick="dFixed()">${d.fixed?'Tak':'Nie'}</button></div>`,
`<h2 class="text-2xl font-extrabold">Dieta i spacery</h2><p class="muted text-sm mt-1 mb-5">Ustal codzienną rutynę.</p><label>Liczba posiłków dziennie<div class="grid grid-cols-4 gap-2 mt-2">${[1,2,3,4].map(n=>`<button class="chip ${d.meals==n?'active':''}" onclick="dMeals(${n})">${n}</button>`).join('')}</div></label><label class="mt-4">Rodzaj karmy<select id="w_food">${['Sucha','Mokra','Mieszana'].map(x=>`<option ${d.foodType===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="mt-3">Częstotliwość spacerów<select id="w_walk">${['1 raz dziennie (30 min)','2 razy dziennie (30 min)','3 razy dziennie (30 min)','2 razy dziennie (45 min)'].map(x=>`<option ${d.walks===x?'selected':''}>${x}</option>`).join('')}</select></label>`,
`<h2 class="text-2xl font-extrabold">Zdrowie i identyfikacja</h2><p class="muted text-sm mt-1 mb-5">Dodaj ważne informacje.</p><label>Znane alergie (opcjonalnie)<input id="w_allergies" value="${esc(d.allergies.join(', '))}" placeholder="np. kurczak, pszenica"></label><label class="mt-3">Temperament i ważne uwagi<textarea id="w_temp" rows="4">${esc(d.temperament)}</textarea></label>`,
`<h2 class="text-2xl font-extrabold">Dane kontaktowe</h2><p class="muted text-sm mt-1 mb-5">Przydadzą się w nagłym przypadku.</p><label>Imię i nazwisko weterynarza<input id="w_vet" value="${esc(d.vet)}" placeholder="np. dr Anna Kowalska"></label><label class="mt-3">Nazwa kliniki<input id="w_clinic" value="${esc(d.clinic)}" placeholder="np. VetCare"></label><label class="mt-3">Bezpośredni numer telefonu<input id="w_phone" value="${esc(d.phone)}" placeholder="+48 123 456 789"></label>`,
`<div class="text-center py-6"><div class="text-6xl mb-4">✓</div><h2 class="text-3xl font-black">Gotowe!</h2><p class="muted mt-2">Profil Twojego psa został utworzony.</p><div class="dog-avatar text-4xl mx-auto mt-6">🐕</div><div class="font-bold text-xl mt-2">${esc(d.name)||'Twój pies'}</div></div>`
][wizStep-1];document.getElementById('wiz').innerHTML=body+`<div class="flex justify-between items-center mt-6"><button class="btn card ${wizStep===1?'invisible':''}" onclick="wizBack()">Wstecz</button><button class="btn btn-primary" onclick="wizNext()">${wizStep===7?'Przejdź do aplikacji':'Dalej →'}</button></div><div class="flex justify-center gap-1 mt-5">${Array.from({length:7},(_,i)=>`<i class="wizard-dot ${i+1===wizStep?'active':''}"></i>`).join('')}</div>`;document.getElementById('stepNo').textContent=wizStep;document.getElementById('stepTitle').textContent=['Podstawowe informacje','Wiek i data','Waga i zdrowie','Dieta i spacery','Zdrowie i identyfikacja','Dane kontaktowe','Gotowe!'][wizStep-1];bindBreed()}
function collect(){let g=id=>document.getElementById(id);if(g('w_name'))state.dog.name=g('w_name').value.trim();if(g('w_breed'))state.dog.breed=g('w_breed').value.trim();if(g('w_chip'))state.dog.chip=g('w_chip').value.trim();if(g('w_dob'))state.dog.dob=g('w_dob').value;if(g('w_adoption'))state.dog.adoption=g('w_adoption').value;if(g('w_weight'))state.dog.weight=g('w_weight').value;if(g('w_min'))state.dog.idealMin=g('w_min').value;if(g('w_max'))state.dog.idealMax=g('w_max').value;if(g('w_food'))state.dog.foodType=g('w_food').value;if(g('w_walk'))state.dog.walks=g('w_walk').value;if(g('w_allergies'))state.dog.allergies=g('w_allergies').value.split(',').map(x=>x.trim()).filter(Boolean);if(g('w_temp'))state.dog.temperament=g('w_temp').value;if(g('w_vet'))state.dog.vet=g('w_vet').value;if(g('w_clinic'))state.dog.clinic=g('w_clinic').value;if(g('w_phone'))state.dog.phone=g('w_phone').value;save()}
function wizNext(){collect();if(wizStep<7){wizStep++;wiz()}else{state.onboarded=true;save();render();toast('Profil psa gotowy')}}
function wizBack(){collect();if(wizStep>1){wizStep--;wiz()}}
function dGender(x){state.dog.gender=x;wiz()} function dFixed(){state.dog.fixed=!state.dog.fixed;wiz()} function dMeals(x){state.dog.meals=x;wiz()}
function bindBreed(){let i=document.getElementById('w_breed'),l=document.getElementById('breedList');if(!i||!l)return;i.oninput=()=>{let q=i.value.toLowerCase();l.innerHTML=breeds.filter(x=>x.toLowerCase().includes(q)).slice(0,5).map(x=>`<button class="block w-full text-left px-3 py-2 bg-[#232323] border-b border-[#333] text-sm" onclick="pickBreed('${x}')">⌕ ${x}</button>`).join('')};}
function pickBreed(x){document.getElementById('w_breed').value=x;document.getElementById('breedList').innerHTML=''}
function openModal(title,body){document.getElementById('sheet').innerHTML=`<div class="flex justify-between items-center mb-4"><h2 class="text-xl font-extrabold">${title}</h2><button class="iconbtn" onclick="closeModal()">×</button></div>${body}`;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openHydration(){openModal('Dodaj wypitą wodę',`<div class="flex gap-2 mb-4">${['Mało','Normalnie','Dużo'].map(x=>`<button class="chip flex-1 ${x==='Normalnie'?'active':''}" onclick="waterLevel(this,'${x}')">${x}</button>`).join('')}</div><details class="mb-4"><summary class="cursor-pointer muted">Dodaj dokładne ml (opcjonalnie)</summary><input id="h_ml" type="number" placeholder="np. 250" class="mt-3"></details><label>Źródło wody<select id="h_source"><option>Miska</option><option>Kran</option><option>Butelka turystyczna</option></select></label><div class="grid grid-cols-2 gap-2 mt-3"><label>Data<input id="h_date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Godzina<input id="h_time" type="time" value="${new Date().toTimeString().slice(0,5)}"></label></div><label class="mt-3">Notatki (opcjonalnie)<textarea id="h_note" rows="3" placeholder="np. po spacerze"></textarea></label><button class="btn btn-primary w-full mt-4" onclick="saveHydration()">Zapisz</button>`)}
function waterLevel(el,x){document.querySelectorAll('#sheet .chip').forEach(b=>b.classList.remove('active'));el.classList.add('active');el.dataset.level=x}
function saveHydration(){let chips=[...document.querySelectorAll('#sheet .chip')],level=(chips.find(x=>x.classList.contains('active'))||{}).dataset?.level||'Normalnie';state.hydration.push({level,ml:document.getElementById('h_ml').value,source:document.getElementById('h_source').value,date:document.getElementById('h_date').value,time:document.getElementById('h_time').value,note:document.getElementById('h_note').value});save();closeModal();render();toast('Wpis nawodnienia zapisany')}
function openAddSupply(key='food'){openModal('Co chcesz dodać?',`<div class="space-y-3"><button class="card rounded-2xl p-4 w-full text-left" onclick="foodMethod()">🐾 <b>Karma</b><div class="muted text-sm">Dodaj lub uzupełnij karmę</div></button><button class="card rounded-2xl p-4 w-full text-left" onclick="supplyForm()">📦 <b>Inny zapas</b><div class="muted text-sm">Żwirek, akcesoria itp.</div></button></div>`)}
function foodMethod(){openModal('Jak chcesz dodać karmę?',`<div class="space-y-3"><button class="card rounded-2xl p-4 w-full text-left" onclick="foodForm()">▦ <b>Zeskanuj kod kreskowy</b><div class="muted text-sm">Aparat</div></button><button class="card rounded-2xl p-4 w-full text-left" onclick="foodForm()">🔗 <b>Z linku ze sklepu</b><div class="muted text-sm">Auto-uzupełnienie</div></button><button class="card rounded-2xl p-4 w-full text-left" onclick="foodForm()">✎ <b>Uzupełnij ręcznie</b><div class="muted text-sm">Formularz</div></button></div>`)}
function foodForm(){openModal('Dodaj karmę',`<label>Zdjęcie produktu<input type="file" accept="image/*"></label><div class="grid grid-cols-2 gap-2 mt-3"><label>Nazwa karmy<input id="f_name" placeholder="np. Karma dla psa"></label><label>Marka<input id="f_brand" placeholder="np. Psiak"></label></div><div class="flex items-center justify-between mt-3"><span>Ulubiona</span><button id="f_fav" class="chip" onclick="this.classList.toggle('active')">★</button></div><label class="mt-3">Rodzaj karmy<div class="flex gap-2 mt-2">${['Sucha','Mokra','Mieszana'].map(x=>`<button class="chip ${x==='Sucha'?'active':''}" onclick="foodTypePick(this)">${x}</button>`).join('')}</div></label><label class="mt-3">Dieta weterynaryjna<div class="flex flex-wrap gap-2 mt-2">${['Nerkowa','Moczowa','Wątrobowa','Cukrzycowa','Żołądkowo-jelitowa','Hipoalergiczna','Odchudzająca','Stawy','Kardiologiczna','Rekonwalescencja'].map(x=>`<button class="chip" onclick="this.classList.toggle('active')">${x}</button>`).join('')}</div></label><div class="grid grid-cols-2 gap-2 mt-3"><label>Wielkość porcji<input id="f_portion" placeholder="100 g"></label><label>Kalorie na porcję<input id="f_cal" placeholder="350 kcal"></label></div><label class="mt-3">Analiza gwarantowana<button class="btn card w-full mt-1" type="button">⌁ Skanuj etykietę</button></label><div class="grid grid-cols-2 gap-2 mt-3"><label>Cena<input id="f_price" type="number" step=".01"></label><label>Waga<input id="f_weight" placeholder="2 kg"></label></div><label class="mt-3">Przypomnij o zamówieniu<select><option>7 dni przed</option><option>14 dni przed</option><option>30 dni przed</option></select></label><label class="mt-3">Data ważności<input type="date"></label><label class="mt-3">Notatki<textarea rows="2"></textarea></label><button class="btn btn-primary w-full mt-4" onclick="saveFood()">Zapisz karmę</button>`)}
function foodTypePick(el){el.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
function saveFood(){state.inventory.food.push({name:document.getElementById('f_name').value||'Karma',brand:document.getElementById('f_brand').value,price:document.getElementById('f_price').value,qty:document.getElementById('f_weight').value,unit:''});save();closeModal();render();toast('Karma dodana do zapasów')}
function supplyForm(){openModal('Dodaj zapas',`<label>Nazwa<input id="s_name" placeholder="np. Saszetki"></label><div class="grid grid-cols-2 gap-2 mt-3"><label>Cena opakowania<input id="s_price" type="number" step=".01"></label><label>Kategoria<select id="s_cat"><option>Żwirek</option><option>Akcesoria</option><option>Zabawki</option><option>Pielęgnacja</option><option>Inne</option></select></label></div><div class="grid grid-cols-2 gap-2 mt-3"><label>Ilość<input id="s_qty" type="number"></label><label>Jednostka<select id="s_unit"><option>kg</option><option>g</option><option>szt.</option><option>ml</option></select></label></div><label class="mt-3">Zużycie (opcjonalnie) na X dni<input placeholder="np. 1 szt. / 7 dni"></label><label class="mt-3">Próg niskiego stanu<input placeholder="np. 2"></label><label class="mt-3">Przypomnij o zamówieniu<select><option>5 dni przed</option><option>7 dni przed</option><option>14 dni przed</option></select></label><label class="mt-3">Link do sklepu<input type="url" placeholder="https://..."></label><label class="mt-3">Notatki<textarea rows="2"></textarea></label><button class="btn btn-primary w-full mt-4" onclick="saveSupply()">Zapisz</button>`)}
function saveSupply(){state.inventory.other.push({name:document.getElementById('s_name').value||'Zapas',price:document.getElementById('s_price').value,qty:document.getElementById('s_qty').value,unit:document.getElementById('s_unit').value});save();closeModal();render();toast('Zapas dodany')}
function openTask(){openModal('Dodaj czynność',`<label>Nazwa<input id="t_name" placeholder="np. Wieczorny spacer"></label><div class="grid grid-cols-2 gap-2 mt-3"><label>Godzina<input id="t_time" type="time"></label><label>Rodzaj<input id="t_type" placeholder="np. Spacer"></label></div><button class="btn btn-primary w-full mt-4" onclick="saveTask()">Dodaj</button>`)}
function saveTask(){state.tasks.push({id:Date.now(),n:document.getElementById('t_name').value||'Nowa czynność',time:document.getElementById('t_time').value||'—',type:document.getElementById('t_type').value||'Opieka',done:false});save();closeModal();render();toast('Czynność dodana')}
function openExpense(){openModal('Dodaj wydatek',`<label>Kategoria<select id="e_cat"><option>Karma</option><option>Akcesoria</option><option>Zabawki</option><option>Weterynarz</option><option>Leki</option><option>Pielęgnacja</option></select></label><label class="mt-3">Kwota (zł)<input id="e_amt" type="number" step=".01"></label><label class="mt-3">Notatki<textarea id="e_note" rows="2"></textarea></label><button class="btn btn-primary w-full mt-4" onclick="saveExpense()">Zapisz wydatek</button>`)}
function saveExpense(){state.expenses.push({category:document.getElementById('e_cat').value,amount:document.getElementById('e_amt').value,note:document.getElementById('e_note').value,date:new Date().toISOString()});save();closeModal();render();toast('Wydatek zapisany')}
function openHealth(){openModal('Dodaj wpis zdrowotny',`<label>Tytuł<input id="hh_title" placeholder="np. Wizyta kontrolna"></label><label class="mt-3">Data<input id="hh_date" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label class="mt-3">Notatka<textarea id="hh_note" rows="3"></textarea></label><button class="btn btn-primary w-full mt-4" onclick="saveHealth()">Zapisz</button>`)}
function saveHealth(){state.health.push({title:document.getElementById('hh_title').value||'Wpis zdrowotny',date:fmtDate(document.getElementById('hh_date').value),note:document.getElementById('hh_note').value});save();closeModal();render();toast('Wpis zdrowotny zapisany')}
function startEditDog(){wizStep=1;state.onboarded=false;render();wiz()}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='psiakapka-kopia.json';a.click();URL.revokeObjectURL(a.href);toast('Kopia danych została wyeksportowana')}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();toast('Dane zostały zaimportowane')}catch{toast('Nie udało się zaimportować danych')}};r.readAsText(f)}
function callVet(){if(state.dog.phone)location.href='tel:'+state.dog.phone.replace(/\s/g,'');else toast('Brak numeru weterynarza')}
function printSOS(){let d=state.dog,w=window.open('','_blank');w.document.write(`<html lang="pl"><body style="font-family:Arial;padding:40px"><h1>PsiakApka — Karta SOS</h1><h2>${esc(d.name)}</h2><p>Rasa: ${esc(d.breed)}</p><p>Waga: ${esc(d.weight)} kg</p><p>Weterynarz: ${esc(d.vet)}</p><p>Klinika: ${esc(d.clinic)}</p><p>Telefon: ${esc(d.phone)}</p><p>Alergie: ${esc(d.allergies.join(', '))}</p><p>Uwagi: ${esc(d.temperament)}</p><hr><p>Wydrukowano z PsiakApka.</p></body></html>`);w.document.close();w.print()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.add('hidden'),2300)}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
render(); if(!state.onboarded)wiz();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
